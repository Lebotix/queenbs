
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Queen B's Cleaning Service</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lato:wght@400;700&family=Ephesis&family=Lobster&display=swap" rel="stylesheet">
    <script>
      // CRITICAL: Shim process.env to prevent "process is not defined" errors in browser environments
      if (typeof process === "undefined") {
        window.process = { env: {} };
      }
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              gold: {
                400: '#FACC15',
                500: '#EAB308',
                600: '#CA8A04',
              },
              royal: {
                800: '#1e293b',
                900: '#0f172a',
              }
            },
            fontFamily: {
              serif: ['"Playfair Display"', 'serif'],
              sans: ['Lato', 'sans-serif'],
              cursive: ['Ephesis', 'cursive'],
              display: ['Lobster', 'cursive'],
            },
            keyframes: {
              logoAppear: {
                '0%': { opacity: '0', transform: 'scale(0.8) translateY(30px)' },
                '100%': { opacity: '1', transform: 'scale(1) translateY(0)' },
              },
              subtleFloat: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-15px)' },
              }
            },
            animation: {
              'logo-entrance': 'logoAppear 1.5s cubic-bezier(0.22, 1, 0.36, 1) forwards',
              'float': 'subtleFloat 6s ease-in-out infinite',
            }
          }
        }
      }
    </script>
    <style>
      /* Smooth scrolling for anchor links */
      html {
        scroll-behavior: smooth;
      }
      
      /* Custom utility for combining animations if needed, 
         but we'll apply them thoughtfully in the component */
      .logo-combined-animation {
        animation: logoAppear 1.5s cubic-bezier(0.22, 1, 0.36, 1) forwards, 
                   subtleFloat 6s ease-in-out infinite 1.5s;
      }
    </style>

  }
}
</script>

  </body>
